<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>건기식 위클리</title>
<meta name="description" content="한국 건강기능식품 신제품·규제·시장 동향 주간 리포트 아카이브">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f7f6f2; --surface:#ffffff; --surface-2:#f0eee8; --ink:#1c1d1f; --ink-2:#55585e; --ink-3:#8a8d93;
  --line:#e2dfd6; --accent:#2f6b4f; --accent-soft:#e3efe8;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141516; --surface:#1c1d20; --surface-2:#24262a; --ink:#ecebe7; --ink-2:#b4b6ba; --ink-3:#7f8288;
    --line:#2f3136; --accent:#7cc2a0; --accent-soft:#1f3229; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#141516; --surface:#1c1d20; --surface-2:#24262a; --ink:#ecebe7; --ink-2:#b4b6ba; --ink-3:#7f8288;
  --line:#2f3136; --accent:#7cc2a0; --accent-soft:#1f3229; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit;text-decoration:none}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header.top{border-bottom:1px solid var(--line);background:var(--surface)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.theme-btn{background:none;border:1px solid var(--line);color:var(--ink-2);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.hero{padding:48px 0 24px}
.eyebrow{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.04em}
h1{font-size:clamp(28px,4.5vw,40px);line-height:1.25;letter-spacing:-.02em;margin:8px 0 10px}
.lead{color:var(--ink-2);margin:0}
.latest{display:block;margin:28px 0 8px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:22px 24px;box-shadow:var(--shadow);transition:transform .15s}
.latest:hover{transform:translateY(-2px)}
.latest .badge{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:999px}
.latest h2{font-size:22px;margin:10px 0 4px;letter-spacing:-.01em}
.latest .range{color:var(--ink-3);font-size:14px}
.latest .trend{margin:12px 0 0;color:var(--ink-2)}
.meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--ink-2)}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:36px 0 8px}
.filters button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:4px 12px;border-radius:999px;cursor:pointer}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.month{font-size:14px;font-weight:700;color:var(--ink-3);margin:28px 0 10px;letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.wk{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);transition:border-color .15s}
.wk:hover{border-color:var(--accent)}
.wk .no{font-size:12px;font-weight:700;color:var(--accent)}
.wk h3{font-size:17px;margin:4px 0 2px}
.wk .range{font-size:13px;color:var(--ink-3)}
.wk ul{margin:10px 0 0;padding-left:18px;font-size:14px;color:var(--ink-2)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:12px}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.empty{color:var(--ink-3);font-size:14px;padding:16px 0}
footer{margin-top:56px;padding:28px 0 48px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="./">건기식 <span>위클리</span></a>
  <button class="theme-btn" id="themeBtn" type="button">테마 전환</button>
</div></header>

<main class="wrap">
  <div class="hero">
    <div class="eyebrow">KOREA HEALTH FUNCTIONAL FOOD · WEEKLY</div>
    <h1>주간 건강식품 신제품 리포트</h1>
    <p class="lead">매주 월~일 국내에서 출시·보도된 건강기능식품 신제품과 규제·시장 이슈를 정리합니다. 주차를 눌러 지난 리포트를 볼 수 있습니다.</p>
    <div id="latest"></div>
  </div>

  <div class="filters" id="filters"></div>
  <div id="list"></div>
</main>

<footer><div class="wrap">
  <p>표의 날짜·성분·가격은 각 주차 리포트에 링크된 원문 기사 기준입니다. 기능성 문구는 회사 발표 기준이며, 구매 권유가 아닙니다.</p>
</div></footer>

<!--
  주차 목록. 새 리포트를 추가할 때는 reports/YYYY-Www.html 파일을 만들고
  아래 배열의 맨 앞에 항목 하나를 추가하세요. (최신 주차가 맨 앞)
-->
<script type="application/json" id="weeks">
[
  {
    "id": "2026-W41",
    "file": "reports/2026-W41.html",
    "start": "2026-10-05",
    "end": "2026-10-11",
    "published": "2026-10-17",
    "products": 5,
    "companies": 2,
    "categories": ["수면", "눈", "이너뷰티", "비타민·활력"],
    "trend": "장건강·혈당 대형 출시는 전주에 몰렸고, 지난주는 수면·눈·이너뷰티로 라인업을 넓히는 출시가 중심.",
    "highlights": [
      "바디프랜드 수면·눈·활력 건기식 3종 (10/8)",
      "뉴트리 에버콜라겐 프라임 2종 (10/8)",
      "에이스바이옴 ACE-01 개별인정 제2026-33호 (10/8)"
    ]
  }
]
</script>

<script>
(function(){
  var root=document.documentElement, KEY='hf-theme';
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  var saved=get(KEY); if(saved) root.setAttribute('data-theme',saved);
  document.getElementById('themeBtn').addEventListener('click',function(){
    var cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    var next=cur==='dark'?'light':'dark'; root.setAttribute('data-theme',next); set(KEY,next);
  });

  var weeks=[];
  try{weeks=JSON.parse(document.getElementById('weeks').textContent)}catch(e){}
  weeks.sort(function(a,b){return a.start<b.start?1:-1});

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function md(d){var p=d.split('-');return (+p[1])+'월 '+(+p[2])+'일'}
  function wkNo(id){var m=/W(\d+)/.exec(id);return m?(+m[1])+'주차':id}
  function range(w){return md(w.start)+' ~ '+md(w.end)}

  var latest=weeks[0], L=document.getElementById('latest');
  if(latest){
    L.innerHTML='<a class="latest" href="'+esc(latest.file)+'">'+
      '<span class="badge">최신 · '+esc(latest.start.slice(0,4))+'년 '+esc(wkNo(latest.id))+'</span>'+
      '<h2>'+esc(range(latest))+' 리포트</h2>'+
      '<div class="range">발행 '+esc(latest.published)+'</div>'+
      '<p class="trend">'+esc(latest.trend)+'</p>'+
      '<div class="meta"><span>신제품 <b>'+latest.products+'</b>개</span><span>기업 <b>'+latest.companies+'</b>곳</span><span>'+esc(latest.categories.join(' · '))+'</span></div>'+
      '</a>';
  }

  var cats=[];
  weeks.forEach(function(w){(w.categories||[]).forEach(function(c){if(cats.indexOf(c)<0)cats.push(c)})});
  var active='전체', F=document.getElementById('filters');
  ['전체'].concat(cats).forEach(function(c){
    var b=document.createElement('button'); b.type='button'; b.textContent=c;
    if(c===active)b.className='on';
    b.onclick=function(){active=c;[].forEach.call(F.children,function(x){x.className=x===b?'on':''});render()};
    F.appendChild(b);
  });

  function render(){
    var list=document.getElementById('list'), html='', lastMonth='';
    var shown=weeks.filter(function(w){return active==='전체'||(w.categories||[]).indexOf(active)>=0});
    if(!shown.length){list.innerHTML='<p class="empty">해당 카테고리 리포트가 없습니다.</p>';return}
    shown.forEach(function(w){
      var m=w.start.slice(0,4)+'년 '+(+w.start.slice(5,7))+'월';
      if(m!==lastMonth){ if(lastMonth) html+='</div>'; html+='<div class="month">'+m+'</div><div class="grid">'; lastMonth=m; }
      html+='<a class="wk" href="'+esc(w.file)+'">'+
        '<span class="no">'+esc(wkNo(w.id))+'</span>'+
        '<h3>'+esc(range(w))+'</h3>'+
        '<span class="range">신제품 '+w.products+'개 · 발행 '+esc(w.published)+'</span>'+
        '<ul>'+(w.highlights||[]).map(function(h){return '<li>'+esc(h)+'</li>'}).join('')+'</ul>'+
        '<div class="tags">'+(w.categories||[]).map(function(c){return '<span class="tag">'+esc(c)+'</span>'}).join('')+'</div>'+
        '</a>';
    });
    list.innerHTML=html+'</div>';
  }
  render();
})();
</script>
</body>
</html>
